<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Source Panel loops</title>
<style>
  /* Loop stage: 1280×720 CSS px, rendered at 3× = 3840×2160.
     A gradient background, one cropped prototype window, a cursor. */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #EFE3D3; }
  .bg { position: fixed; inset: 0; background-size: cover; background-position: center; }
  .window {
    position: fixed; overflow: hidden;
    border-radius: var(--r, 32px);
    box-shadow: 0 0 0 1.3px rgba(222, 212, 196, 1), 0 14px 40px rgba(70, 42, 28, 0.20);
    background: #F6F3EC;
  }
  .window.fade-top { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 20%); mask-image: linear-gradient(to bottom, transparent 0, #000 20%); box-shadow: 0 0 0 1.3px rgba(222, 212, 196, 1); }
  .window.fade-bottom { -webkit-mask-image: linear-gradient(to top, transparent 0, #000 20%); mask-image: linear-gradient(to top, transparent 0, #000 20%); box-shadow: 0 0 0 1.3px rgba(222, 212, 196, 1); }
  .window iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #F6F3EC; }
  /* Square loops: headline on the gradient (Bricolage Grotesque, OFL) */
  @font-face { font-family: "Bricolage"; src: url(fonts/bricolage-grotesque-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
  .headline {
    position: fixed; left: 50%; top: 58px; transform: translateX(-50%); width: 600px; margin: 0; z-index: 5;
    font: 600 40px/1.1 "Bricolage", system-ui, sans-serif; letter-spacing: -0.02em; text-align: center;
    color: #2A221C; text-wrap: balance;
  }
  .cursor { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; will-change: transform; }
  .cursor svg { display: block; fill: #2C2823; stroke: #fff; stroke-width: 1.5; stroke-linejoin: round;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); transform-origin: 15% 15%; transition: transform 120ms cubic-bezier(0.23,1,0.32,1); }
  .cursor.pressing svg { transform: scale(0.85); }
  .finger { position: fixed; left: 0; top: 0; z-index: 10; pointer-events: none; border-radius: 50%;
    background: rgba(44, 40, 35, 0.22); box-shadow: 0 0 0 2px rgba(255,255,255,0.9); opacity: 0; transition: opacity 160ms ease-out, scale 160ms ease-out; }
  .finger.on { opacity: 1; }
  .finger.pressing { scale: 0.85; }
</style>
</head>
<body>
  <div class="bg" id="bg"></div>
  <div class="window" id="win"><iframe id="app" title="Prototype"></iframe></div>
  <script src="../icons.js"></script>
  <script src="loops.js"></script>
</body>
</html>
